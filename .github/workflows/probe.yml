name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe_views.py
      - run: |
          git config user.name bot; git config user.email actions@users.noreply.github.com
          git add probe.json; git commit -qm probe; git pull -q --rebase origin main; git push -q
