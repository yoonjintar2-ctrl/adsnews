name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe_search.py
      - run: |
          git config user.name bot; git config user.email actions@users.noreply.github.com
          git add probe.json; git commit -qm probe; for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 3; done
