name: Claude 원고 반영
# 예약 작업(Claude)은 main에 직접 올리지 않고 claude/** 브랜치에 올린다.
# 이 워크플로가 그 브랜치에서 바뀐 파일을 main에 그대로 옮긴다(발행인 11/27).
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: write
concurrency:
  group: merge-claude
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bring branch changes into main
        env:
          BR: ${{ github.ref_name }}
        run: |
          git config user.name "ad-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch -q origin "$BR"
          BASE=$(git merge-base origin/main "origin/$BR")
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" "origin/$BR" | grep -v -E '^(\.github/|index\.html$|v2\.html$|CNAME$)' || true)
          if [ -z "$FILES" ]; then echo "nothing to merge"; exit 0; fi
          echo "$FILES"
          echo "$FILES" | while read -r f; do mkdir -p "$(dirname "$f")"; git show "origin/$BR:$f" > "$f"; done
          git add -A $FILES
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          MSG=$(git log -1 --format=%s "origin/$BR")
          git commit -q -m "$MSG"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && echo merged && exit 0; sleep 7; done
          exit 1
