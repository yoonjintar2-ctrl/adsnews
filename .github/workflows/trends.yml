name: 실시간 트렌드 갱신
# GitHub's own */5 schedule often runs only every hour or two on new repos,
# so each run loops for ~30 minutes (one refresh every 5 minutes) and then
# starts the next run itself. The schedule below is only a safety net.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: trends
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Share-card renderer
        run: pip install -q playwright pillow || true
      - name: Refresh every 5 minutes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_MODEL: ${{ secrets.IMAGE_MODEL }}
        run: |
          git config user.name "ad-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          for round in 1 2 3 4 5 6; do
            git pull -q --rebase origin main || true
            python scripts/fetch_trends.py || echo "trends failed"
            python scripts/discover.py || echo "discover failed"
            python scripts/fetch_views.py || echo "views failed"
            python scripts/fill_photos.py || echo "photos failed"
            python scripts/fill_desc.py || echo "desc failed"
            python scripts/brand_news.py || echo "bnews failed"
            python scripts/fill_og.py || echo "og failed"
            python scripts/gen_images.py || echo "images failed"
            python scripts/archive_brief.py || echo "archive failed"
            python scripts/make_puzzle.py || echo "puzzle failed"
            python scripts/make_share.py || echo "share failed"
            python scripts/archive_edition.py || echo "edition failed"
            python scripts/make_seo.py || echo "seo failed"
            git add live.json data.json editorials.json puzzle.json featured.json people.json trendnotes.json img s archive e sitemap.xml
            if ! git diff --cached --quiet; then
              git commit -q -m "실시간 트렌드 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
              for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
            fi
            [ "$round" -lt 6 ] && sleep 290
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run trends.yml --ref main -R "$GITHUB_REPOSITORY" || true
