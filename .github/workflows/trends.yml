name: 실시간 트렌드 갱신
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trends
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch trends
        run: python scripts/fetch_trends.py
      - name: Fetch video views
        run: python scripts/fetch_views.py || echo 'views step failed'
      - name: Commit
        run: |
          git config user.name "ad-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "실시간 트렌드 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
