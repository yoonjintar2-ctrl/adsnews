name: 금로동 기자 Threads 게시
# 아침 사설(07:30, 08:30 재시도) · 점심 트렌드 노트(12:10, 13:10) · 저녁 오늘의 광고인(18:10, 19:10), KST
on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"
    - cron: "10 3 * * *"
    - cron: "10 4 * * *"
    - cron: "10 9 * * *"
    - cron: "10 10 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "ed(사설) / tn(트렌드) / person(광고인), 비우면 시간대에 맞춰"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: threads
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post to Threads
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python scripts/post_threads.py ${{ github.event.inputs.slot }}
      - name: Save posting log
        run: |
          git config user.name "ad-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add threads.json
          git diff --cached --quiet && exit 0
          git commit -m "Threads 게시 기록"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
